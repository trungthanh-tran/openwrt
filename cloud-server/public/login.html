<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sbproxy Cloud · Đăng nhập</title>
<style>
  :root{--bg:#eef1f4;--panel:#fff;--border:#d5dce3;--text:#16202b;--dim:#5c6b78;--accent:#0d8f80;--accent2:#0a6a5f;--asoft:#d3efe9;--crit:#cc2f4a;--mono:ui-monospace,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1015;--panel:#141c24;--border:#26323f;--text:#e6edf3;--dim:#94a3b0;--accent:#2dd4bf;--accent2:#7ff0e2;--asoft:#113631;--crit:#f26c81}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:var(--sans)}
  .card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px 26px;box-shadow:0 10px 40px rgba(0,0,0,.12)}
  .logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(150deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#04231f;font-family:var(--mono);font-weight:700;font-size:19px;margin-bottom:14px}
  h1{font-size:19px;margin:0 0 3px}p.sub{margin:0 0 20px;color:var(--dim);font-size:13.5px}
  label{font-size:12px;color:var(--dim);display:block;margin:12px 0 5px}
  input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);font-size:14px;font-family:var(--sans)}
  input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  button{width:100%;margin-top:20px;padding:11px;border:none;border-radius:9px;background:var(--accent);color:#04231f;font-weight:700;font-size:14px;cursor:pointer}
  button:hover{filter:brightness(1.05)}
  .err{color:var(--crit);font-size:13px;margin-top:12px;min-height:18px}
</style>
</head>
<body>
  <form class="card" id="f">
    <div class="logo">sb</div>
    <h1>sbproxy Cloud</h1>
    <p class="sub">Đăng nhập để điều khiển &amp; giám sát router</p>
    <label>Tài khoản</label>
    <input id="u" autocomplete="username" autofocus>
    <label>Mật khẩu</label>
    <input id="p" type="password" autocomplete="current-password">
    <button type="submit">Đăng nhập</button>
    <div class="err" id="e"></div>
  </form>
<script>
  document.getElementById("f").addEventListener("submit", async e => {
    e.preventDefault();
    const err = document.getElementById("e"); err.textContent = "";
    try {
      const r = await fetch("/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: document.getElementById("u").value, password: document.getElementById("p").value })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "đăng nhập thất bại");
      location.href = "/app.html";
    } catch (x) { err.textContent = x.message; }
  });
</script>
</body>
</html>
