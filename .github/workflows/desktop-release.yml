name: Build desktop executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Validate tag and source version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $sourceVersion = (Get-Content VERSION -Raw).Trim()
          if ($tagVersion -ne $sourceVersion) {
            throw "Tag version $tagVersion does not match VERSION $sourceVersion"
          }

      - name: Build Windows executable
        shell: pwsh
        working-directory: console/desktop
        run: .\build.ps1

      - name: Build router update package
        shell: pwsh
        run: .\pc\make-package.ps1 -OutDir .\console\desktop\dist

      - name: Package agent and scripts documentation
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $dist = Join-Path $PWD "console\desktop\dist"
          tar -czf (Join-Path $dist "sbproxy-agent-$version.tar.gz") -C $PWD `
            README.md README.vi.md LICENSE VERSION agent
          if ($LASTEXITCODE -ne 0) { throw "Could not package agent" }
          tar -czf (Join-Path $dist "sbproxy-scripts-docs-$version.tar.gz") -C $PWD `
            README.md README.vi.md LICENSE VERSION scripts docs CONTRIBUTING.md SECURITY.md
          if ($LASTEXITCODE -ne 0) { throw "Could not package scripts and docs" }

      - name: Add version to executable filename
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $exe = ".\console\desktop\dist\sbproxy-console.exe"
          Rename-Item -LiteralPath $exe -NewName "sbproxy-console-$version.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbproxy-${{ github.ref_name || github.sha }}
          path: |
            console/desktop/dist/sbproxy-console-*.exe
            console/desktop/dist/sbproxy-*.tar.gz
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            .\console\desktop\dist\sbproxy-console-*.exe `
            .\console\desktop\dist\sbproxy-*.tar.gz `
            --title "sbproxy ${{ github.ref_name }}" --generate-notes
