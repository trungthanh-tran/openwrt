name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # nftables so the pool suite can hand its generated ruleset to `nft -c`.
      # The runner is unprivileged and nft needs netlink, but it has passwordless
      # sudo, which the suite uses for that read-only check and nothing else.
      - name: Install shellcheck, jq, nftables, and Tk bindings
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq nftables python3-tk

      - name: Full test suite
        run: sh tests/run-all.sh

      - name: Shellcheck
        run: shellcheck -S warning scripts/*.sh tests/*.sh tests/vm/*.sh pc/*.sh console/desktop/*.sh config/settings.sh agent/install-agent.sh agent/cgi/sbproxy agent/sbproxy-healthd agent/sbproxy-assignd agent/sbproxy-dhcp-assign agent/sbproxy-webauth
