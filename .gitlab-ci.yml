# GitLab CI mirror of .github/workflows/ci.yml. Runs the suite under BusyBox
# ash (Alpine) — the real router shell — plus shellcheck.
stages:
  - check

ci:
  stage: check
  image: alpine:3.20
  before_script:
    - apk add --no-cache shellcheck jq git python3 py3-tkinter
  script:
    - sh tests/run-all.sh
    - shellcheck -S warning scripts/*.sh tests/*.sh pc/*.sh console/desktop/*.sh config/settings.sh agent/install-agent.sh agent/cgi/sbproxy agent/sbproxy-healthd
